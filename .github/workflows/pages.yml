name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 実行中のデプロイは止めず、後続をひとつだけ待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # ビルド工程はない。カスタムドメインの直下ではなく
      # /eq-earth/ で配信するため、public/ をその名前のディレクトリに入れる
      - name: Stage site under /eq-earth
        run: |
          mkdir -p _site/eq-earth
          cp -R public/. _site/eq-earth/
          touch _site/.nojekyll
          echo 'gh.mezum.jp' > _site/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
